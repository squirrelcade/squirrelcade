name: CI

# Documents the app neither bundles nor tests: a push changing only these runs nothing (Actions
# minutes are limited on a private repository). docs/help, docs/MATCHING.md and CHANGELOG.md are in the app, so
# they still run it.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'docs/API.md'
      - 'docs/DECISIONS.md'
      - 'docs/IDEAS.md'
      - 'docs/PLAN.md'
      - 'docs/catalog-sources.md'
      - 'scripts/check-links.mjs'
      - '.github/workflows/upkeep.yml'
      - 'docs/guide/**'
      - 'docs/design/**'
      - 'docs/unraid/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
  # By hand (Actions > CI > Run workflow, or gh workflow run CI --ref main): checks a commit whose push skipped CI.
  workflow_dispatch:

# A newer push to the same branch replaces a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:eol
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: squirrelcade:ci
          build-args: VERSION=${{ github.sha }}
      - name: Start the container and check it answers
        run: |
          docker run -d --name squirrelcade -p 7575:7575 squirrelcade:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7575/api/v1/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:7575/api/v1/auth/session | grep '"setupRequired":true'
          curl -fsS http://127.0.0.1:7575/ | grep -q '<div id="root">'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # For the browser walk-through: playwright-core drives the runner's own Chrome (no browser download).
      - run: npm ci
      - name: Walk through a fresh install, then the interface in Chrome
        run: node scripts/smoke-test.mjs http://127.0.0.1:7575
        env:
          SMOKE_UI: '1'
      - name: Container log
        if: always()
        run: docker logs squirrelcade
