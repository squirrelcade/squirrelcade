name: CI

# Documents the app neither bundles nor tests: a push changing only these runs nothing (a run would test nothing they
# change). docs/help, docs/MATCHING.md and CHANGELOG.md are in the app, so they still run it.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'docs/API.md'
      - 'docs/DECISIONS.md'
      - 'docs/IDEAS.md'
      - 'docs/PLAN.md'
      - 'docs/catalog-sources.md'
      - 'scripts/check-links.mjs'
      - '.github/workflows/upkeep.yml'
      - 'docs/guide/**'
      - 'docs/design/**'
      - 'docs/unraid/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
  # By hand (Actions > CI > Run workflow, or gh workflow run CI --ref main): checks a commit whose push skipped CI.
  workflow_dispatch:

# A newer push to the same branch replaces a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:eol
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The image for Intel/AMD and for 64-bit ARM, each built and run on its own kind of machine (no emulator).
  docker:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            elf: 3e
          - arch: arm64
            runner: ubuntu-24.04-arm
            elf: b7
    name: docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: squirrelcade:ci
          build-args: VERSION=${{ github.sha }}
      - name: Start the container and check it answers
        run: |
          docker run -d --name squirrelcade -p 7575:7575 squirrelcade:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7575/api/v1/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:7575/api/v1/auth/session | grep '"setupRequired":true'
          curl -fsS http://127.0.0.1:7575/ | grep -q '<div id="root">'
      # A program for this processor (the ELF header's machine: 3e x86-64, b7 64-bit ARM) that runs: given an empty
      # folder, it reports that there's no library.
      - name: The Playnite reader is built for this processor and runs
        run: |
          docker cp squirrelcade:/app/bin/playnite-reader /tmp/reader
          file /tmp/reader || true
          [ "$(od -An -tx1 -j18 -N1 /tmp/reader | tr -d ' ')" = "${{ matrix.elf }}" ]
          docker exec squirrelcade sh -c '/app/bin/playnite-reader --library-dir /tmp 2>&1; true' | grep '"ok":false'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # For the browser walk-through: playwright-core drives the runner's own Chrome (no browser download).
      - run: npm ci
      # The interface is the same code on both, so it's walked in a browser on Intel/AMD; ARM gets the API's walk-through.
      - name: Walk through a fresh install, then the interface in Chrome
        run: node scripts/smoke-test.mjs http://127.0.0.1:7575
        env:
          SMOKE_UI: ${{ matrix.arch == 'amd64' && '1' || '' }}
      - name: Container log
        if: always()
        run: docker logs squirrelcade
