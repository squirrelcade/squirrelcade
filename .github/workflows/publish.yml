name: Publish image

# Tests the code, then pushes the image to the GitHub Container Registry (ghcr.io/<owner>/squirrelcade, public) for
# Intel/AMD (linux/amd64) and 64-bit ARM (linux/arm64): each one built, started and checked on its own kind of machine
# (no emulator: under one, the ARM build crashed in 2026-09), then both put under the same labels, so a pull takes the
# one that fits the computer.
# Two labels move at their own pace (D141):
# - A release (Releases > publish vX.Y.Z, the version in package.json) builds `latest`, `X.Y.Z` and `X.Y`, and `edge`:
#   what everyone installs, and only what was released.
# - Started by hand (Actions > Publish image > Run workflow, on main) builds `edge` and `X.Y.Z-<commit>` only: each
#   change as soon as it passes, for an install that wants it first; `latest` doesn't move.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:eol
      - run: npm run typecheck
      - run: npm test

  labels:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v5
      - name: Name, version and labels
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/squirrelcade"
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "release" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "The release $GITHUB_REF_NAME doesn't match package.json's version $version." >&2
            exit 1
          fi
          tags="$image:edge $image:$version-${GITHUB_SHA::7}"
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            tags="$tags $image:latest $image:$version $image:${version%.*}"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  build:
    needs: labels
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            elf: 3e
          - arch: arm64
            runner: ubuntu-24.04-arm
            elf: b7
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.labels.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build it
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: squirrelcade:check
          build-args: VERSION=${{ env.VERSION }}
      - name: Start it and check it answers, its Playnite reader included
        run: |
          docker run -d --name sc -p 7575:7575 squirrelcade:check
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:7575/api/v1/health && break; sleep 1; done
          echo
          curl -fsS http://127.0.0.1:7575/api/v1/health | grep -q "\"version\":\"$VERSION\""
          curl -fsS http://127.0.0.1:7575/api/v1/auth/session | grep -q '"setupRequired":true'
          # The reader is a program for this processor (the ELF header's machine: 3e x86-64, b7 64-bit ARM), and it runs:
          # given an empty folder, it reports that there's no library.
          docker cp sc:/app/bin/playnite-reader /tmp/reader
          file /tmp/reader || true
          [ "$(od -An -tx1 -j18 -N1 /tmp/reader | tr -d ' ')" = "${{ matrix.elf }}" ]
          docker exec sc sh -c '/app/bin/playnite-reader --library-dir /tmp 2>&1; true' | grep '"ok":false'
          docker rm -f sc
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same build from its cache, pushed without a label: the publish job below labels both at once.
      - name: Push it
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
          outputs: type=image,name=${{ needs.labels.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Keep its digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: [labels, build]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.labels.outputs.image }}
      TAGS: ${{ needs.labels.outputs.tags }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Both under the labels
        working-directory: /tmp/digests
        run: |
          args=()
          for t in $TAGS; do args+=(-t "$t"); done
          docker buildx imagetools create "${args[@]}" $(printf "$IMAGE@sha256:%s " *)
      - name: What was published
        run: docker buildx imagetools inspect "$IMAGE:${{ needs.labels.outputs.version }}"
