name: Try an ARM image

# Runs only when started by hand: Actions > Try an ARM image > Run workflow.
# Builds the image for 64-bit ARM (a Raspberry Pi 4 or 5, ARM NAS models) under emulation, starts it and asks its
# health, then throws it away: nothing is published. The Publish image workflow stays Intel/AMD only until this
# passes and the owner says so.
# First try (2026-09-29): under emulation, the deps stage's npm ci crashed about 15 seconds in ("qemu: uncaught target
# signal 4 (Illegal instruction)") and hung until the timeout. A native ARM runner (runs-on: ubuntu-24.04-arm, free for
# public repositories) avoids the emulator.
on:
  workflow_dispatch:

jobs:
  arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: squirrelcade:arm64-test
      - name: Start it and ask its health
        run: |
          docker run -d --name sc --platform linux/arm64 -p 7575:7575 squirrelcade:arm64-test
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:7575/api/v1/health; then echo; docker exec sc uname -m; exit 0; fi
            sleep 2
          done
          docker logs sc
          exit 1
      - name: The Playnite reader is an ARM program
        run: |
          machine=$(docker exec sc sh -c "od -An -tx1 -j18 -N1 /app/bin/playnite-reader" | tr -d " ")
          echo "ELF machine: $machine (b7 is 64-bit ARM)"
          [ "$machine" = "b7" ]
